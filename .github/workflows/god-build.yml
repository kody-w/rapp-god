name: god-build
# Captures version frames and regenerates the legacy registry + static API. Observed mirrors may
# drift without failing; the pinned v0.6.9 authority hash is enforced.
on:
  push:
    branches: [ main ]
    paths:
      - "manifest.json"
      - "build_god.py"
      - "api/**"
      - "registry.json"
      - "authority/**"
      - "provenance/observatory-*"
      - "README.md"
      - "MONOREPO.md"
      - "GRAIL_SCAN.md"
      - ".github/workflows/god-build.yml"
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: god-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Fetch the native baseline commit only
        # native_provenance rebuilds the closure against the 66f47a72 baseline
        # tree. The default shallow checkout does not contain it.
        run: |
          git fetch --no-tags --depth=1 origin 66f47a72767cc59d310ddc07d745cce4d612fae8
          git cat-file -e 66f47a72767cc59d310ddc07d745cce4d612fae8^{commit}
      - name: Capture versions + rebuild registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 build_god.py
      - name: Rebind the ledgers this rebuild invalidates
        # registry.json and api/v1/status.json are digest-bound native closure
        # records. Rebuilding them without rebinding left assimilation-integrity
        # red on a 6-hour timer, and the [skip ci] commit below meant no run ever
        # reported it. Regeneration order matters: the generated manifest digests
        # every other provenance artifact, so it is rebound last.
        run: |
          git add -A versions registry.json api provenance
          python3 tools/native_provenance.py --refresh-native-only
          python3 tools/stage_materialized.py --plan
          git add -A versions registry.json api provenance
          python3 tools/staged_secret_scan.py
          python3 tools/generated_manifest.py
          git add -A versions registry.json api provenance
      - name: Verify the rebuilt tree still closes
        # Fail closed: a drifting observatory must not be committed.
        run: |
          python3 tools/native_provenance.py --check
          python3 tools/stage_materialized.py --check-plan
          python3 tools/stage_materialized.py --check
          python3 tools/staged_secret_scan.py --check
          python3 tools/generated_manifest.py --check
      - name: Commit new frames + registry (only if changed)
        run: |
          git config user.name "rapp-god"
          git config user.email "actions@users.noreply.github.com"
          git add -A versions registry.json api provenance
          if git diff --cached --quiet; then
            echo "no new frames, no drift change — nothing to commit"
          else
            git commit -m "rapp-god: capture frames + refresh registry [skip ci]"
            git push
          fi
