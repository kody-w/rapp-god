name: assimilation-integrity

on:
  push:
    paths:
      - "authority/**"
      - "vendor/**"
      - "src/**"
      - "products/**"
      - "services/**"
      - "integrations/**"
      - "instances/**"
      - "examples/**"
      - "docs/**"
      - "migrations/**"
      - "archive/**"
      - "observatory/**"
      - "provenance/**"
      - "catalog/**"
      - "compat/**"
      - "workspace/**"
      - "security/**"
      - "tools/**"
      - "tests/**"
      - "api/**"
      - "registry.json"
      - "manifest.json"
      - "build_god.py"
      - "README.md"
      - "MONOREPO.md"
      - "GRAIL_SCAN.md"
      - "WORKSPACE.json"
      - ".github/workflows/assimilation-integrity.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generator-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # CONTENT GATES. Everything else in this matrix verifies where the
          # bytes CAME FROM -- provenance, licensing, portability. Nothing
          # verified what is IN them. staged_secret_scan.py already existed and
          # already had a --check mode; it was simply never a build step, so
          # MONOREPO.md "Updating" steps 1-2 (quarantine, review secret-scan
          # findings) were prose a pass could skip. On 2026-07-23 a pass did:
          # the import carried a live-looking Azure key and a captured
          # authenticated M365 session into this public repo.
          # RECONSTITUTABLE. The egg is a complete census, but a census is not
          # an artifact: this repo carries 39 brainstem.py copies and, until
          # hatch.sh, nothing declared which one you run. An egg nobody has
          # hatched on a clean box is a claim. This proves it serves.
          - task: hatch
            command: ./hatch.sh --check
          - task: staged-secrets
            command: python3 tools/staged_secret_scan.py --check
          # The remediation scope is fixed and reviewed. This fails if a later
          # pass quietly redacts one more file, quietly restores a leaked one,
          # or launders a redaction into the upstream provenance.
          - task: redactions
            command: python3 tools/security_redactions.py --check
          - task: no-session-captures
            command: python3 tools/no_session_captures.py --check
          - task: semantic
            command: python3 tools/semantic_catalog.py --check
          - task: tests
            command: python3 tools/test_catalog.py --check
          - task: portability
            command: python3 tools/portability.py --check
          - task: licenses
            command: python3 tools/license_inventory.py --check
          - task: native
            command: python3 tools/native_provenance.py --check
          - task: source-captures
            command: python3 tools/source_capture.py --check
          - task: observatory-history
            command: python3 tools/observatory_history.py --check
          - task: archives
            command: python3 tools/archive_inventory.py check-public
          - task: refs-releases
            command: python3 tools/ref_inventory.py --check-public
          - task: rapp-map-wrapper
            command: python3 tools/wrappers/rapp_map_offline.py --check
          - task: rapp-spine-wrapper
            command: python3 tools/wrappers/rapp_spine_offline.py --check
          - task: ultracode-rdw-overlay
            command: python3 tools/wrappers/ultracode_local_rdw.py --check
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # native_provenance and observatory_history verify against the
          # PREVIOUS commit's tree and registry. The default shallow
          # checkout has only HEAD, so both died with git exit 128 --
          # this workflow had been red since the 2026-07-23 import for
          # that reason alone, which is how a genuine content failure
          # could have hidden in an already-red oracle.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Check generated ${{ matrix.task }}
        run: ${{ matrix.command }}

  offline-integrity:
    needs: generator-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # native_provenance and observatory_history verify against the
          # PREVIOUS commit's tree and registry. The default shallow
          # checkout has only HEAD, so both died with git exit 128 --
          # this workflow had been red since the 2026-07-23 import for
          # that reason alone, which is how a genuine content failure
          # could have hidden in an already-red oracle.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Check offline observatory generation
        run: python3 build_god.py --check
      - name: Check generated artifact digests and staging closure
        run: |
          python3 tools/generated_manifest.py --check
          python3 tools/stage_materialized.py --check-plan
          python3 tools/stage_materialized.py --check
          python3 tools/staged_secret_scan.py --check
      - name: Verify exact imports and deterministic indexes
        run: python3 -m unittest tests.test_assimilation tests.test_compat tests.test_wrappers tests.test_quarantine_matching -v
